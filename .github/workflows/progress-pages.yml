name: Publish reviewed progress atlas

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: progress-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Package only the reviewed report
        run: |
          test -f public/progress/index.html
          test ! -L public/progress/index.html
          mkdir _site
          cp public/progress/index.html _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
